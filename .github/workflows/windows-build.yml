name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-build.yml"
      - "backend/**"
      - "windows/**"
      - "scripts/build_windows.ps1"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Windows app and installer
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: N-AI-Windows-${{ github.run_number }}
          path: |
            dist/windows/N-AI.exe
            dist/windows/N-AI-Setup.exe
            dist/windows/SETUP.txt
          if-no-files-found: error
          retention-days: 30
